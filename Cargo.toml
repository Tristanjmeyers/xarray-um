[package]
name = "xarray-um"
version = "0.1.0"
description = "Rust decoding backend for xarray-um"
repository = "https://github.com/Tristanjmeyers/xarray-um"
edition = "2021"
license = "GPL-3.0-or-later"
[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde_json = "1"
