name: Build and verify wheels
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Build portable wheel and source distribution
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: '2014'
          args: --release --locked --out dist --interpreter python${{ matrix.python }} --sdist
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          run-install: false
      - name: Verify tag version and archive contents
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/check_artifacts.py dist
      - name: Install wheel into a clean Pixi environment and run synthetic checks
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          python3 scripts/check_wheel.py dist "$RUNNER_TEMP/xarray-um-wheel-check" "$PYTHON_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-py${{ matrix.python }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-x86_64-*
          path: dist
          merge-multiple: true
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "xarray-um $RELEASE_TAG" --notes 'Rust-backed lazy xarray reader for UM fields files. Linux x86-64 wheels for CPython 3.12 and 3.13; GPL-3.0-or-later. See README for Pixi installation and scientific scope.' dist/*
