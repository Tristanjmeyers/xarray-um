[workspace]
channels = ['conda-forge']
name = "xarray-um"
platforms = ['linux-64']
version = "0.2.0"
[tasks]
build = "maturin build --release -o dist"
test = "pytest -q"
[dependencies]
python = "3.13.*"
rust = ">=1.85"
maturin = ">=1.8,<2"
c-compiler = "*"
numpy = ">=2,<3"
xarray = ">=2026.9,<2027"
dask = ">=2026.8"
netcdf4 = ">=1.7"
pyproj = "*"
pytest = "*"
nbformat = "*"
nbclient = "*"
ipykernel = "*"
ipywidgets = ">=8,<9"
jupyterlab_widgets = "*"
matplotlib = "*"
pandas = "*"
psutil = "*"
cf_xarray = ">=0.11,<0.12"

[pypi-dependencies]
xarray-um = { path = ".", editable = true }
